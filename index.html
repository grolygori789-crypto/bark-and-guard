<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>BARK & GUARD — Shih Tzu Defense</title>

  <meta name="theme-color" content="#071f41" />
  <meta name="application-name" content="BARK & GUARD" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BARK & GUARD" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="/bark-and-guard/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/bark-and-guard/assets/app/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/bark-and-guard/assets/app/icons/apple-touch-icon.png" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      background: #000;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="/bark-and-guard/src/pwa/install.js"></script>
  <script type="module" src="/bark-and-guard/src/main.js"></script>
</body>
</html>
