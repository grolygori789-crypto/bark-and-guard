<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6f0e8" />
  <meta name="application-name" content="BARK & GUARD" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BARK & GUARD" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BARK & GUARD — Shih Tzu Defense</title>

  <link rel="manifest" href="/bark-and-guard/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/bark-and-guard/assets/app/icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/bark-and-guard/assets/app/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/bark-and-guard/src/styles/game.css" />
</head>
<body>
  <main id="app" aria-label="BARK & GUARD game">
    <canvas id="game-canvas" aria-label="Stage 1 battlefield"></canvas>

    <div id="loading-screen" class="loading-screen">
      <img src="/bark-and-guard/assets/app/icons/icon-192.png" alt="" />
      <div class="loading-title">BARK &amp; GUARD</div>
      <div class="loading-subtitle">Preparing the garden…</div>
    </div>

    <header id="hud" class="hud glass-ui">
      <div class="brand-chip">
        <img src="/bark-and-guard/assets/app/icons/icon-192.png" alt="" />
        <div><strong>BARK &amp; GUARD</strong><span>SHIH TZU DEFENSE</span></div>
      </div>

      <div class="stat-chip treats-chip"><span class="stat-icon">◆</span><div><small>TREATS</small><strong id="hud-treats">300</strong></div></div>
      <div class="stat-chip hp-chip"><span class="stat-icon">♥</span><div><small>HOME HP</small><strong id="hud-home">100%</strong></div><div class="hp-bar"><i id="hud-home-bar"></i></div></div>
      <div class="stat-chip wave-chip"><span class="stat-icon">●</span><div><small>WAVE</small><strong id="hud-wave">1 / 15</strong></div></div>

      <div class="hud-spacer"></div>
      <button id="start-wave" class="premium-button start-button" type="button"><span class="play-mark">▶</span><span>START WAVE</span></button>
      <button id="speed-button" class="round-control" type="button" aria-label="Game speed">×1</button>
      <button id="pause-button" class="round-control" type="button" aria-label="Pause">Ⅱ</button>
      <button id="settings-button" class="round-control" type="button" aria-label="Settings">⚙</button>
    </header>

    <div id="wave-alert" class="wave-alert glass-ui" aria-live="polite"></div>
    <div id="toast" class="toast glass-ui" aria-live="polite"></div>

    <section id="placement-panel" class="placement-panel glass-ui" aria-hidden="true">
      <div class="panel-heading">
        <div><small>GUARD SPOT</small><strong id="placement-title">Select Shih Tzu</strong></div>
        <button id="placement-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="guardian-cards" class="guardian-cards"></div>
    </section>

    <aside id="settings-panel" class="settings-panel glass-ui" aria-hidden="true">
      <div class="panel-heading"><div><small>BARK &amp; GUARD</small><strong>Settings</strong></div><button id="settings-close" type="button">×</button></div>
      <div class="setting-group">
        <label>Garden lighting</label>
        <div class="segmented" id="time-mode">
          <button data-time="auto" class="active">Auto</button><button data-time="day">Day</button><button data-time="night">Night</button>
        </div>
      </div>
      <button id="install-app" class="install-action" type="button">Install BARK &amp; GUARD</button>
      <p id="install-hint" class="install-hint">Install it once, then launch the game directly from its Home Screen icon.</p>
      <div class="setting-row"><span>Stage</span><strong>1 · Front Garden</strong></div>
      <div class="setting-row"><span>Build</span><strong>Stage 1 Production</strong></div>
    </aside>

    <div id="pause-overlay" class="pause-overlay" aria-hidden="true">
      <section class="pause-card glass-ui">
        <small>GAME PAUSED</small><h2>BARK &amp; GUARD</h2>
        <button id="resume-button" class="premium-button">RESUME</button>
        <button id="restart-button" class="secondary-button">Restart Stage</button>
      </section>
    </div>
  </main>

  <script type="module" src="/bark-and-guard/src/pwa/install.js"></script>
  <script type="module" src="/bark-and-guard/src/main.js"></script>
</body>
</html>
